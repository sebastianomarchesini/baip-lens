name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No install scripts: a compromised dependency cannot run code at install time.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # Runs prepack, which pins the README's links for npm and fails on a relative
      # URL it cannot pin, and checks the file list the same way release.yml does.
      - name: Package contents and README links
        run: |
          npm pack -w baip-lens --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const allowed = /^(dist\/|README\.md$|LICENSE$|NOTICE$|package\.json$)/;
            const extra = files.filter((p) => !allowed.test(p));
            // README.md, LICENSE and NOTICE are copied in by prepack, so this also checks that it ran.
            const missing = ["dist/cli.js", "dist/report-template.html", "README.md", "LICENSE", "NOTICE"].filter((p) => !files.includes(p));
            if (missing.length) { console.error("The package is missing:", missing); process.exit(1); }
            if (extra.length) { console.error("Unexpected files in the package:", extra); process.exit(1); }
            console.log(files.length + " files, all allowed");
          '
          rm pack.json
      - run: npm test
      - name: Coverage (analyzers must stay above 85% lines)
        run: npm run coverage -w baip-lens
      - name: Generate sample report from fixtures
        run: npm run sample
      - name: Offline report check (network disabled)
        if: matrix.node == 24
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload sample reports (Cloud Foundry and project scan)
        if: matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-reports
          path: reports/
